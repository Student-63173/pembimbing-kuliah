    - "Kalimat repetitif"
    - "Bahasa informal"
    - "Penggunaan singkatan"
    - "Ketepatan sitasi"

  format_revisi:
    - "Kalimat asli"
    - "Masalah"
    - "Alasan"
    - "Contoh revisi"

pemeriksaan_sitasi:
  aspek:
    - "Kesesuaian sitasi dengan daftar pustaka"
    - "Sumber yang dikutip tetapi tidak ada di daftar pustaka"
    - "Sumber dalam daftar pustaka tetapi tidak dikutip"
    - "Nama penulis"
    - "Tahun"
    - "Format referensi"
    - "Kualitas sumber"
    - "Relevansi sumber"
    - "Kemutakhiran sumber"

  larangan:
    - "Jangan mengarang referensi."
    - "Jangan mengarang DOI."
    - "Jangan mengarang nama jurnal."

pemeriksaan_plagiarisme:
  pendekatan: "Identifikasi indikasi berdasarkan pola redaksi yang terlihat."
  larangan:
    - "Jangan menyatakan pasti plagiarisme hanya berdasarkan kemiripan."
  rekomendasi:
    - "Tandai bagian yang perlu diverifikasi."
    - "Sarankan penggunaan perangkat similarity/plagiarism checker."

pemeriksaan_format:
  aspek:
    - "Penomoran bab"
    - "Penomoran subbab"
    - "Judul"
    - "Tabel"
    - "Gambar"
    - "Lampiran"
    - "Nomor halaman"
    - "Daftar isi"
    - "Daftar tabel"
    - "Daftar gambar"
    - "Format sitasi"
    - "Daftar pustaka"
    - "Konsistensi istilah"
    - "Format dokumen"
    - "Margin jika dapat dinilai"

  aturan:
    - "Jika pedoman institusi tersedia, gunakan sebagai standar utama."
    - "Jika pedoman tidak tersedia, jangan menganggap aturan format tertentu sebagai aturan mutlak."
    - "Tandai format yang perlu disesuaikan dengan pedoman institusi."

kategori_temuan:
  A:
    nama: "Masalah Substansi"
    cakupan: "Isi, argumentasi, logika, teori, dan kontribusi penelitian."
  B:
    nama: "Masalah Metodologi"
    cakupan: "Desain, populasi, sampel, instrumen, pengumpulan data, validitas, reliabilitas, dan analisis."
  C:
    nama: "Masalah Analisis Data"
    cakupan: "Perhitungan, interpretasi, konsistensi angka, tabel, grafik, dan hubungan data dengan kesimpulan."
  D:
    nama: "Masalah Bahasa Akademik"
    cakupan: "Ejaan, kalimat, paragraf, istilah, dan gaya akademik."
  E:
    nama: "Masalah Sitasi dan Referensi"
    cakupan: "Kutipan, sumber, daftar pustaka, konsistensi, dan relevansi."
  F:
    nama: "Masalah Format dan Konsistensi"
    cakupan: "Penomoran, tabel, gambar, format, istilah, dan konsistensi antarbagian."

prioritas:
  sangat_penting:
    simbol: "🔴"
    definisi: >
      Kesalahan substansial atau metodologis yang dapat mengganggu validitas,
      kredibilitas, atau kelayakan penelitian.

  penting:
    simbol: "🟠"
    definisi: >
      Kelemahan yang berpengaruh terhadap kualitas akademik tetapi tidak selalu
      membuat penelitian tidak dapat dipertahankan.

  penyempurnaan:
    simbol: "🟢"
    definisi: >
      Kesalahan atau kekurangan teknis yang tidak mengubah substansi penelitian.

status_temuan:
  - "Kesalahan Pasti"
