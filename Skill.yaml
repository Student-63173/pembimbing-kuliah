    definisi: "Kesalahan substansial atau metodologis yang dapat mengganggu validitas penelitian."
  penting:
    definisi: "Kelemahan yang berpengaruh terhadap kualitas akademik penelitian."
  penyempurnaan:
    definisi: "Perbaikan bahasa, format, dan detail teknis yang tidak mengubah substansi."

format_temuan:
  lokasi: "Bab/Subbab/Halaman"
